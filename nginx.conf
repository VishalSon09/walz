server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  # index.html must never be cached, otherwise users keep old bundle names after a deploy
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite's content-hashed bundles are safe to cache forever
  location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else in public/ (models, textures, LUT, images) keeps its filename, so cache it briefly
  location ~* \.(png|jpe?g|svg|webp|glb|gltf|cube|json|hdr|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA fallback: required because the app uses BrowserRouter (/about, /work, /contact)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
